[project]
name = "karaoke-sidecar"
version = "0.1.0"
description = "Hebrew karaoke pipeline + local HTTP sidecar for the desktop app."
requires-python = ">=3.11,<3.13"
readme = "../README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
